<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Central de Operações — rotina, ocorrências, contatos, equipamentos, CFTV e manuais. Funciona offline.">
<title>Central de Operações</title>
<style>
:root{
  --bg:#f4f6fb; --bg-2:#eaeef6;
  --panel:#ffffff; --panel-2:#fafbff; --panel-3:#f1f4fb;
  --line:rgba(15,23,42,.08); --line-2:rgba(15,23,42,.14); --line-3:rgba(15,23,42,.22);
  --txt:#0f172a; --txt-2:#475569; --txt-3:#94a3b8;
  --accent:#4f46e5; --accent-2:#7c3aed; --accent-3:#06b6d4;
  --accent-soft:rgba(79,70,229,.09);
  --ok:#10b981; --ok-soft:rgba(16,185,129,.12);
  --warn:#f59e0b; --warn-soft:rgba(245,158,11,.13);
  --bad:#ef4444; --bad-soft:rgba(239,68,68,.11);
  --info:#3b82f6; --info-soft:rgba(59,130,246,.11);
  --pink:#ec4899; --pink-soft:rgba(236,72,153,.11);
  --cyan:#06b6d4; --cyan-soft:rgba(6,182,212,.11);
  --purple:#8b5cf6; --purple-soft:rgba(139,92,246,.11);
  --grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 55%,#a855f7 100%);
  --grad-soft:linear-gradient(135deg,rgba(99,102,241,.10),rgba(168,85,247,.10));
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow:0 4px 14px -6px rgba(15,23,42,.10), 0 2px 4px -2px rgba(15,23,42,.05);
  --shadow-lg:0 20px 45px -22px rgba(15,23,42,.28), 0 8px 18px -10px rgba(15,23,42,.12);
  --shadow-xl:0 32px 70px -28px rgba(15,23,42,.35);
  --r-xs:8px; --r-sm:11px; --r:15px; --r-lg:20px; --r-xl:26px;
  --sidebar:270px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Inter','Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--txt); font-size:14.5px; line-height:1.55;
  -webkit-font-smoothing:antialiased; overflow:hidden;
  font-feature-settings:'cv02','cv03','cv04','cv11','ss01';
}
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(900px 620px at 8% -10%, rgba(99,102,241,.14), transparent 60%),
    radial-gradient(800px 560px at 96% 6%, rgba(168,85,247,.11), transparent 58%),
    radial-gradient(720px 600px at 60% 106%, rgba(6,182,212,.08), transparent 60%);
}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(100,116,139,.22);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(100,116,139,.42);background-clip:content-box}

/* ============ LAYOUT ============ */
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--sidebar) 1fr;height:100vh}

/* ============ SIDEBAR ============ */
.sidebar{
  background:linear-gradient(180deg,#ffffff 0%,#f8fafd 100%);
  border-right:1px solid var(--line); display:flex; flex-direction:column;
  padding:22px 14px 16px; gap:4px; overflow-y:auto;
  box-shadow:1px 0 0 rgba(15,23,42,.02);
}
.brand{display:flex;align-items:center;gap:13px;padding:6px 10px 22px}
.brand-mark{
  width:44px;height:44px;flex-shrink:0;border-radius:14px;background:var(--grad);
  display:grid;place-items:center;
  box-shadow:0 10px 24px -8px rgba(99,102,241,.85),inset 0 1px 0 rgba(255,255,255,.25);
  position:relative;
}
.brand-mark::after{
  content:'';position:absolute;inset:1px;border-radius:13px;
  background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 55%);
  pointer-events:none;
}
.brand-mark svg{width:22px;height:22px;stroke:#fff;position:relative;z-index:1}
.brand-txt strong{display:block;font-size:1rem;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.brand-txt span{font-size:.64rem;color:var(--txt-3);text-transform:uppercase;letter-spacing:.16em;font-weight:700}
.nav-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.14em;color:var(--txt-3);font-weight:800;padding:16px 12px 8px}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:var(--r-sm);
  background:transparent;border:1px solid transparent;color:var(--txt-2);font:inherit;font-size:.875rem;
  font-weight:500;cursor:pointer;text-align:left;width:100%;transition:.18s var(--ease);position:relative;
}
.nav-item:hover{background:var(--accent-soft);color:var(--accent)}
.nav-item.on{
  background:var(--grad);color:#fff;font-weight:600;
  box-shadow:0 12px 22px -12px rgba(99,102,241,.9);
}
.nav-item svg{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;opacity:.95}
svg{max-width:100%;flex:0 0 auto}
.sidebar,.main,.brand-mark,.nav-item{overflow:hidden}
.nav-item .cnt{
  margin-left:auto;font-size:.66rem;font-weight:800;background:rgba(100,116,139,.13);
  color:var(--txt-2);padding:2px 8px;border-radius:20px;min-width:22px;text-align:center;
  letter-spacing:.02em;
}
.nav-item.on .cnt{background:rgba(255,255,255,.25);color:#fff}
.nav-item .cnt.alert{background:var(--bad-soft);color:var(--bad)}
.nav-item.on .cnt.alert{background:rgba(255,255,255,.28);color:#fff}
.side-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.save-state{font-size:.68rem;color:var(--txt-3);text-align:center;line-height:1.4}
.save-state b{color:var(--ok);font-weight:600}

/* ============ MAIN ============ */
.main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  display:flex;align-items:center;gap:16px;padding:18px 30px;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.86);backdrop-filter:blur(14px);
  flex-shrink:0;position:relative;z-index:5;
}
.page-head{min-width:0;flex:1}
.page-head h1{font-size:1.28rem;font-weight:700;letter-spacing:-.025em;display:flex;align-items:center;gap:10px}
.page-head h1 svg{color:var(--accent)}
.page-head p{font-size:.78rem;color:var(--txt-3);margin-top:2px}
.top-tools{display:flex;align-items:center;gap:10px;flex-shrink:0}
.clock{
  display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
  padding:8px 14px;border-radius:var(--r-sm);font-size:.78rem;font-weight:600;color:var(--txt-2);white-space:nowrap;
  box-shadow:var(--shadow-sm);
}
.clock .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2.4s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}
.view{flex:1;overflow-y:auto;padding:26px 30px 80px;scroll-behavior:smooth}
.wrap{max-width:1600px;margin:0 auto}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--panel);border:1px solid var(--line-2);color:var(--txt-2);
  padding:9px 15px;border-radius:var(--r-sm);font:inherit;font-size:.8rem;font-weight:600;
  cursor:pointer;transition:.16s var(--ease);white-space:nowrap;
  box-shadow:var(--shadow-sm);
}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn svg{width:15px;height:15px;stroke:currentColor}
.btn.primary{
  background:var(--grad);border-color:transparent;color:#fff;
  box-shadow:0 10px 22px -10px rgba(99,102,241,.9),inset 0 1px 0 rgba(255,255,255,.18);
}
.btn.primary:hover{color:#fff;filter:brightness(1.06);transform:translateY(-1px)}
.btn.ok{background:var(--ok-soft);border-color:rgba(16,185,129,.3);color:var(--ok)}
.btn.ok:hover{background:rgba(16,185,129,.2);border-color:var(--ok);color:var(--ok)}
.btn.danger{background:var(--bad-soft);border-color:rgba(239,68,68,.26);color:var(--bad)}
.btn.danger:hover{background:rgba(239,68,68,.18);border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:.75rem;min-height:34px}
.btn.icon{padding:8px 10px}
.btn.icon svg{width:15px;height:15px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}

/* ============ CARDS ============ */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);position:relative;
}
.card-pad{padding:20px 22px}
.sect-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:28px 0 14px;flex-wrap:wrap}
.sect-head:first-child{margin-top:0}
.sect-head h2{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:9px;letter-spacing:-.015em}
.sect-head h2 svg{width:18px;height:18px;stroke:var(--accent)}
.sect-head .hint{font-size:.75rem;color:var(--txt-3);font-weight:500}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px}
.kpi{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px;position:relative;overflow:hidden;transition:.22s var(--ease);
  box-shadow:var(--shadow-sm);
}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad)}
.kpi::after{
  content:'';position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;
  background:var(--grad-soft);opacity:.55;pointer-events:none;
}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--line-2)}
.kpi.ok::before{background:linear-gradient(180deg,#10b981,#059669)}
.kpi.warn::before{background:linear-gradient(180deg,#f59e0b,#d97706)}
.kpi.bad::before{background:linear-gradient(180deg,#ef4444,#dc2626)}
.kpi.info::before{background:linear-gradient(180deg,#3b82f6,#2563eb)}
.kpi.cyan::before{background:linear-gradient(180deg,#06b6d4,#0891b2)}
.kpi.purple::before{background:linear-gradient(180deg,#8b5cf6,#7c3aed)}
.kpi.click{cursor:pointer}
.kpi-l{font-size:.63rem;text-transform:uppercase;letter-spacing:.11em;color:var(--txt-3);font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.kpi-l svg{width:13px;height:13px}
.kpi-v{font-size:1.85rem;font-weight:800;line-height:1;letter-spacing:-.035em;color:var(--txt);position:relative;z-index:1}
.kpi.ok .kpi-v{color:var(--ok)} .kpi.warn .kpi-v{color:var(--warn)}
.kpi.bad .kpi-v{color:var(--bad)} .kpi.info .kpi-v{color:var(--info)}
.kpi.cyan .kpi-v{color:var(--cyan)} .kpi.purple .kpi-v{color:var(--purple)}
.kpi-s{font-size:.7rem;color:var(--txt-3);margin-top:6px;display:block;position:relative;z-index:1}

/* ---- ocorrência do dia anterior (Painel) ---- */
.occ-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.occ-text{
  white-space:pre-wrap;font-size:.85rem;line-height:1.68;color:var(--txt-2);
  background:linear-gradient(180deg,#fbfcff,#f6f8fe);
  border:1px solid var(--line);border-radius:var(--r-sm);
  padding:14px 16px;max-height:340px;overflow:auto;font-family:'Inter',sans-serif;
}
.occ-src{
  display:flex;align-items:center;gap:7px;font-size:.73rem;color:var(--txt-3);
  margin-top:11px;line-height:1.5;
}
.occ-src svg{width:14px;height:14px;flex:0 0 auto}

/* ---- abas internas (CFTV) ---- */
.subtabs{display:flex;gap:4px;margin:2px 0 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.subtab{
  display:inline-flex;align-items:center;gap:8px;padding:11px 18px;cursor:pointer;
  background:transparent;border:0;border-bottom:2px solid transparent;color:var(--txt-3);
  font:inherit;font-size:.86rem;font-weight:600;margin-bottom:-1px;transition:.2s var(--ease);
}
.subtab:hover{color:var(--txt-2)}
.subtab.on{color:var(--accent);border-bottom-color:var(--accent)}
.subtab svg{width:16px;height:16px;flex:0 0 auto}
.subtab .cnt{
  font-size:.67rem;font-weight:800;background:rgba(100,116,139,.13);color:var(--txt-2);
  padding:2px 9px;border-radius:9px;
}
.subtab.on .cnt{background:var(--accent-soft);color:var(--accent)}
.subtab .cnt.alert{background:var(--bad-soft);color:var(--bad)}

/* ---- AÇÕES RÁPIDAS (Rotina) ---- */
.acao-cats{display:flex;flex-direction:column;gap:24px;margin-top:8px}
.acao-cat-t{display:flex;align-items:center;gap:9px;font-size:.7rem;font-weight:800;letter-spacing:.13em;
  text-transform:uppercase;color:var(--txt-3);margin-bottom:12px;padding-left:2px}
.acao-cat-t span.ln{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.acao-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.acao-card{
  display:flex;align-items:flex-start;gap:16px;text-align:left;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;
  font:inherit;color:var(--txt);transition:.22s var(--ease);
  min-height:104px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.acao-card::before{
  content:'';position:absolute;inset:0;opacity:0;transition:opacity .22s var(--ease);
  background:var(--grad-soft);
}
.acao-card:hover{
  transform:translateY(-3px);border-color:rgba(99,102,241,.4);
  box-shadow:var(--shadow-lg);
}
.acao-card:hover::before{opacity:.7}
.acao-card>*{position:relative;z-index:1}
.acao-ic{
  display:grid;place-items:center;width:52px;height:52px;min-width:52px;border-radius:15px;
  flex:0 0 auto;border:1px solid transparent;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
}
.acao-ic svg{width:26px;height:26px;stroke-width:1.8}
.acao-tx{display:block;min-width:0;flex:1}
.acao-t{display:block;font-weight:700;font-size:.94rem;line-height:1.3;margin-bottom:4px;letter-spacing:-.01em}
.acao-d{display:block;font-size:.78rem;color:var(--txt-3);line-height:1.45}
/* cores por categoria */
.acao-ic.acesso   {background:var(--accent-soft);border-color:rgba(79,70,229,.25);color:var(--accent)}
.acao-ic.medico   {background:var(--ok-soft);    border-color:rgba(16,185,129,.28);color:var(--ok)}
.acao-ic.elev     {background:var(--warn-soft);  border-color:rgba(245,158,11,.3); color:var(--warn)}
.acao-ic.seg      {background:var(--bad-soft);   border-color:rgba(239,68,68,.25); color:var(--bad)}
.acao-ic.cftv     {background:var(--info-soft);  border-color:rgba(59,130,246,.28);color:var(--info)}
.acao-ic.oper     {background:var(--purple-soft);border-color:rgba(139,92,246,.28);color:var(--purple)}
.acao-ic.limpeza  {background:var(--cyan-soft);  border-color:rgba(6,182,212,.3);  color:var(--cyan)}
.acao-ic.pink     {background:var(--pink-soft);  border-color:rgba(236,72,153,.28);color:var(--pink)}

/* ---- prévia do texto (modal) ---- */
.previa-box{
  margin-top:18px;border:1px solid var(--line-2);border-radius:var(--r);
  background:linear-gradient(180deg,#fbfcff,#f5f7fe);padding:15px;
}
.previa-head{
  display:flex;align-items:center;gap:8px;font-size:.68rem;font-weight:800;text-transform:uppercase;
  letter-spacing:.1em;color:var(--txt-3);margin-bottom:10px;
}
.previa-head svg{width:14px;height:14px;flex:0 0 auto}
.previa-txt{
  white-space:pre-wrap;font-size:.86rem;line-height:1.68;color:var(--txt);min-height:52px;
  font-family:'Inter',sans-serif;
}
.previa-txt:empty::before{content:'Preencha os campos para ver o texto pronto.';color:var(--txt-3)}

/* ---- sugestões inteligentes (baseadas no histórico) ---- */
.sug-wrap{margin-top:18px;border-top:1px dashed var(--line-2);padding-top:16px}
.sug-head{display:flex;align-items:center;gap:8px;font-size:.7rem;font-weight:800;text-transform:uppercase;
  letter-spacing:.1em;color:var(--txt-3);margin-bottom:10px}
.sug-head svg{width:14px;height:14px;color:var(--purple)}
.sug-list{display:flex;flex-direction:column;gap:8px;max-height:230px;overflow:auto;padding-right:2px}
.sug-item{
  background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-sm);
  padding:11px 13px;cursor:pointer;transition:.16s var(--ease);text-align:left;
  font:inherit;color:var(--txt);display:block;width:100%;
}
.sug-item:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateX(2px)}
.sug-meta{font-size:.68rem;color:var(--txt-3);font-weight:700;margin-bottom:3px;display:flex;gap:8px;flex-wrap:wrap}
.sug-txt{font-size:.78rem;color:var(--txt-2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---- histórico de resumos ---- */
.occ-list{max-height:520px;overflow:auto;margin-top:4px;display:flex;flex-direction:column;gap:8px}
.occ-row{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-sm);
  background:var(--panel-2);border:1px solid var(--line);cursor:pointer;
  transition:.16s var(--ease);
}
.occ-row:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateX(3px)}
.occ-row .d{font-weight:700;font-size:.82rem;min-width:88px;color:var(--txt)}
.occ-row .t{font-size:.68rem;font-weight:800;padding:3px 9px;border-radius:9px;
  background:var(--accent-soft);color:var(--accent);letter-spacing:.02em}
.occ-row .t.noturno{background:var(--purple-soft);color:var(--purple)}
.occ-row .t.diurno{background:var(--warn-soft);color:var(--warn)}
.occ-row .p{font-size:.78rem;color:var(--txt-3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.occ-row .h{font-size:.72rem;color:var(--txt-3);white-space:nowrap}

.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}

/* ============ BADGES / PILLS ============ */
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;
  font-size:.67rem;font-weight:700;letter-spacing:.01em;white-space:nowrap;
  border:1px solid transparent;
}
.pill.ok    {background:var(--ok-soft);    color:var(--ok);    border-color:rgba(16,185,129,.2)}
.pill.warn  {background:var(--warn-soft);  color:var(--warn);  border-color:rgba(245,158,11,.22)}
.pill.bad   {background:var(--bad-soft);   color:var(--bad);   border-color:rgba(239,68,68,.2)}
.pill.info  {background:var(--info-soft);  color:var(--info);  border-color:rgba(59,130,246,.22)}
.pill.purple{background:var(--purple-soft);color:var(--purple);border-color:rgba(139,92,246,.22)}
.pill.cyan  {background:var(--cyan-soft);  color:var(--cyan);  border-color:rgba(6,182,212,.22)}
.pill.mute  {background:rgba(100,116,139,.09);color:var(--txt-2);border-color:rgba(100,116,139,.14)}
.tag{
  display:inline-block;padding:2px 9px;border-radius:7px;font-size:.63rem;font-weight:800;
  text-transform:uppercase;letter-spacing:.06em;background:var(--accent-soft);color:var(--accent);
}
.tag.SW{background:var(--purple-soft);color:var(--purple)}
.tag.DVR{background:var(--pink-soft);color:var(--pink)}
.tag.NVR{background:var(--cyan-soft);color:var(--cyan)}
.tag.NOB{background:var(--warn-soft);color:var(--warn)}
.tag.SRV{background:var(--info-soft);color:var(--info)}
.tag.MON{background:rgba(100,116,139,.13);color:var(--txt-2)}

/* ============ TOOLBAR ============ */
.tools{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  box-shadow:var(--shadow-sm);
}
.inp,.sel{
  background:var(--panel);border:1px solid var(--line-2);color:var(--txt);
  padding:9px 13px;border-radius:var(--r-sm);font:inherit;font-size:.82rem;outline:none;
  transition:.16s var(--ease);
}
.inp::placeholder{color:var(--txt-3)}
.inp:focus,.sel:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.sel{cursor:pointer}
.grow{flex:1;min-width:200px}
.seg{display:flex;gap:3px;background:var(--panel-3);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px}
.seg button{
  background:transparent;border:none;color:var(--txt-3);font:inherit;font-size:.76rem;font-weight:600;
  padding:7px 14px;border-radius:8px;cursor:pointer;transition:.16s var(--ease);white-space:nowrap;
}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--panel);color:var(--accent);box-shadow:var(--shadow-sm)}

/* ============ TABLE ============ */
.tbl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.tbl-scroll{overflow:auto;max-height:calc(100vh - 340px)}
table{width:100%;border-collapse:collapse;font-size:.815rem}
thead th{
  text-align:left;padding:12px 14px;font-size:.63rem;text-transform:uppercase;letter-spacing:.09em;
  color:var(--txt-3);font-weight:800;background:var(--panel-3);border-bottom:1px solid var(--line-2);
  white-space:nowrap;position:sticky;top:0;z-index:5;
}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line);color:var(--txt);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover td{background:var(--accent-soft)}
tbody tr:last-child td{border-bottom:none}
td.mono{font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:.76rem;color:var(--txt-2)}
td.strong{font-weight:600}
td.acts{white-space:nowrap;text-align:right}
td.acts .btn{padding:6px 9px}
.empty{padding:58px 22px;text-align:center;color:var(--txt-3)}
.empty svg{width:42px;height:42px;stroke:var(--txt-3);opacity:.45;margin-bottom:14px}
.empty b{display:block;color:var(--txt-2);font-size:.94rem;margin-bottom:6px;font-weight:600}
.empty span{font-size:.79rem}
.rowbar{display:flex;align-items:center;justify-content:space-between;padding:10px 15px;
  border-top:1px solid var(--line);font-size:.73rem;color:var(--txt-3);background:var(--panel-2)}

/* ============ SWITCH ============ */
.sw{position:relative;width:44px;height:24px;border-radius:20px;background:rgba(239,68,68,.4);cursor:pointer;transition:.22s var(--ease);border:none;flex-shrink:0;padding:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.22s var(--ease);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.sw.on{background:var(--ok)}
.sw.on::after{left:23px}

/* ============ PROGRESS ============ */
.bar{height:6px;border-radius:5px;background:rgba(100,116,139,.13);overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;border-radius:5px;background:var(--grad);transition:width .4s var(--ease)}
.bar i.done{background:linear-gradient(90deg,#10b981,#059669)}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-row small{font-size:.72rem;color:var(--txt-3);font-weight:700;white-space:nowrap;min-width:38px;text-align:right}

/* ============ CHECK / STEP LIST ============ */
.steps{display:flex;flex-direction:column;gap:3px;margin-top:10px}
.step{display:flex;align-items:flex-start;gap:11px;padding:10px 12px;border-radius:var(--r-sm);transition:.16s var(--ease);cursor:pointer;border:1px solid transparent}
.step:hover{background:var(--accent-soft)}
.step.done .step-t{text-decoration:line-through;color:var(--txt-3)}
.step.done{opacity:.7}
.chk{
  width:20px;height:20px;border-radius:7px;border:2px solid var(--line-3);flex-shrink:0;margin-top:1px;
  display:grid;place-items:center;transition:.16s var(--ease);
}
.step.done .chk{background:var(--ok);border-color:var(--ok)}
.chk svg{width:12px;height:12px;stroke:#fff;opacity:0;transition:.16s var(--ease);stroke-width:3.4}
.step.done .chk svg{opacity:1}
.step-t{font-size:.85rem;line-height:1.5;flex:1}
.step-n{font-size:.7rem;color:var(--txt-3);font-weight:800;min-width:20px;margin-top:1px}

/* ============ LIST ITEMS ============ */
.item-list{display:flex;flex-direction:column;gap:10px}
.item{
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
  transition:.18s var(--ease);display:flex;gap:13px;align-items:flex-start;
}
.item:hover{border-color:rgba(99,102,241,.36);background:var(--panel);box-shadow:var(--shadow-sm)}
.item.alert{border-left:3px solid var(--bad)}
.item.done{opacity:.6}
.item-ic{
  width:38px;height:38px;border-radius:11px;background:var(--accent-soft);display:grid;place-items:center;flex-shrink:0;
}
.item-ic svg{width:18px;height:18px;stroke:var(--accent)}
.item-ic.ok{background:var(--ok-soft)} .item-ic.ok svg{stroke:var(--ok)}
.item-ic.warn{background:var(--warn-soft)} .item-ic.warn svg{stroke:var(--warn)}
.item-ic.bad{background:var(--bad-soft)} .item-ic.bad svg{stroke:var(--bad)}
.item-ic.info{background:var(--info-soft)} .item-ic.info svg{stroke:var(--info)}
.item-body{flex:1;min-width:0}
.item-t{font-weight:600;font-size:.875rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item-m{font-size:.73rem;color:var(--txt-3);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.item-acts{display:flex;gap:6px;flex-shrink:0;align-items:center}

/* ============ STAT ROW ============ */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:11px}
.stat{text-align:center;padding:13px 8px;background:var(--panel-3);border-radius:var(--r-sm);border:1px solid var(--line)}
.stat b{display:block;font-size:1.3rem;font-weight:800;color:var(--txt);line-height:1.1;letter-spacing:-.025em}
.stat span{font-size:.61rem;text-transform:uppercase;letter-spacing:.08em;color:var(--txt-3);font-weight:800;margin-top:4px;display:block}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)}

/* ============ MODAL ============ */
.backdrop{
  position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(8px);z-index:200;
  display:grid;place-items:center;padding:24px;animation:fade .18s var(--ease);
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.modal{
  background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-xl);
  width:100%;max-width:640px;max-height:90vh;display:flex;flex-direction:column;
  box-shadow:var(--shadow-xl);animation:rise .22s var(--ease);overflow:hidden;
}
.modal.wide{max-width:940px}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff,var(--panel-2))}
.modal-h h3{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.modal-h h3 svg{width:18px;height:18px;stroke:var(--accent)}
.modal-b{padding:22px 24px;overflow-y:auto;flex:1}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--line);background:var(--panel-2)}
.x{background:transparent;border:none;color:var(--txt-3);cursor:pointer;font-size:1.4rem;line-height:1;padding:4px 8px;border-radius:8px;transition:.16s var(--ease)}
.x:hover{background:var(--bad-soft);color:var(--bad)}

/* ============ FORM ============ */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--txt-3);font-weight:800}
.field input,.field select,.field textarea{
  background:var(--panel);border:1px solid var(--line-2);color:var(--txt);
  padding:10px 13px;border-radius:var(--r-sm);font:inherit;font-size:.85rem;outline:none;
  transition:.16s var(--ease);width:100%;
}
.field textarea{resize:vertical;min-height:88px;line-height:1.55}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.hintline{font-size:.73rem;color:var(--txt-3);margin-top:8px;line-height:1.55}

/* ============ TOAST ============ */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:400;display:flex;align-items:center;gap:11px;
  background:var(--panel);border:1px solid var(--ok);color:var(--ok);
  padding:14px 20px;border-radius:var(--r);font-weight:600;font-size:.83rem;
  box-shadow:var(--shadow-xl);animation:rise .24s var(--ease);max-width:400px;
}
.toast svg{width:18px;height:18px;stroke:currentColor;flex-shrink:0}
.toast.err{border-color:var(--bad);color:var(--bad)}
.toast.info{border-color:var(--info);color:var(--info)}
.toast.warn{border-color:var(--warn);color:var(--warn)}

.sec-note{
  background:var(--warn-soft);border:1px solid rgba(245,158,11,.28);border-radius:var(--r);
  padding:14px 17px;font-size:.79rem;color:#92400e;line-height:1.6;display:flex;gap:11px;
}
.sec-note svg{width:18px;height:18px;stroke:var(--warn);flex-shrink:0;margin-top:1px}
.muted{color:var(--txt-3)}
.mono{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
.nowrap{white-space:nowrap}
.right{text-align:right}
.mt{margin-top:18px} .mt-s{margin-top:10px} .mb{margin-bottom:18px}
.legend{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:20px;
  background:var(--panel);border:1px solid var(--line);font-size:.76rem;font-weight:600;color:var(--txt-2);
  cursor:pointer;transition:.16s var(--ease);font-family:inherit;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip .c{background:rgba(100,116,139,.13);padding:1px 8px;border-radius:10px;font-size:.67rem;color:var(--txt-2);font-weight:800}
.chip.on .c{background:rgba(79,70,229,.16);color:var(--accent)}
.chip .d{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.d-ok{background:var(--ok)} .d-bad{background:var(--bad)} .d-ip{background:var(--info)} .d-an{background:var(--warn)}

/* ============ RESPONSIVE ============ */
@media(max-width:1080px){
  .app{grid-template-columns:78px 1fr}
  .brand-txt,.nav-label,.nav-item span.lbl,.nav-item .cnt{display:none}
  .nav-item{justify-content:center;padding:13px 0}
  .brand{justify-content:center;padding:6px 0 20px}
  .side-foot{display:none}
  .fgrid{grid-template-columns:1fr}
}
@media(max-width:820px){
  body{overflow:auto}
  .app{display:block;height:auto}
  .sidebar{position:sticky;top:0;z-index:100;flex-direction:row;overflow-x:auto;padding:10px 12px;
    border-right:none;border-bottom:1px solid var(--line);gap:5px}
  .brand,.nav-label{display:none}
  .nav-item{width:auto;flex-shrink:0;padding:10px 14px}
  .nav-item span.lbl{display:inline}
  .main{height:auto}
  .view{overflow:visible;padding:18px 16px 60px}
  .tbl-scroll{max-height:none}
  .topbar{flex-wrap:wrap;padding:14px 16px}
  .page-head{flex-basis:100%}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .grid-2{grid-template-columns:1fr}
  .acao-grid{grid-template-columns:1fr}
}
@media print{
  .sidebar,.topbar,.tools,.item-acts,.btn{display:none!important}
  body{overflow:visible;background:#fff;color:#000}
  .app{display:block}
  .card,.tbl-wrap{border:1px solid #ccc;box-shadow:none;background:#fff}
}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button,a,[data-act]{-webkit-tap-highlight-color:transparent}
.btn,.nav-item,.chip,.subtab{touch-action:manipulation}
.btn{min-height:38px}
input,select,textarea{font-size:16px;max-width:100%}
.occ-row{min-width:0;flex-wrap:wrap;align-items:flex-start;padding:14px}
.occ-row .p{flex:1 1 100%;min-width:0;line-height:1.5;overflow-wrap:anywhere}
.occ-row .d{min-width:0}
.occ-text,.previa-txt{overflow-wrap:anywhere;word-break:normal}

@media(max-width:820px){
  html,body{min-height:100%;height:auto}
  body{overflow-x:hidden;overflow-y:auto;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  .app{display:block;height:auto;min-height:100dvh;padding-bottom:0}
  .sidebar{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:1000;display:block;
    overflow:visible!important;width:100%;height:auto;
    padding:8px 5px calc(8px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.97);backdrop-filter:blur(20px);
    border-top:1px solid var(--line-2);border-bottom:0;
    box-shadow:0 -10px 30px -18px rgba(15,23,42,.22);
  }
  #nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;width:100%}
  .brand,.nav-label,.side-foot{display:none!important}
  .nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    width:100%;min-width:0;min-height:56px;padding:8px 2px;border-radius:11px;overflow:visible;
    white-space:normal;text-align:center;font-size:.68rem;line-height:1.1}
  .nav-item span.lbl{display:block!important;max-width:100%;font-size:.63rem;line-height:1.15;
    white-space:normal;overflow-wrap:anywhere}
  .nav-item svg{width:20px;height:20px;min-width:20px}
  .nav-item .cnt{display:none!important}
  .nav-item.on{box-shadow:none;background:var(--accent-soft);border-color:rgba(99,102,241,.3);color:var(--accent)}
  .main{height:auto;min-height:0;overflow:visible;padding-bottom:0}
  .topbar{position:sticky;top:0;z-index:50;gap:8px;padding:13px 14px;
    background:rgba(255,255,255,.95);backdrop-filter:blur(16px)}
  .page-head{flex:1 1 100%;min-width:0}
  .page-head h1{font-size:1.14rem}
  .page-head p{font-size:.73rem;line-height:1.4}
  .top-tools{width:100%;justify-content:space-between;gap:8px}
  .clock{padding:7px 10px;font-size:.75rem}
  #btnNew{flex:1;min-width:0;white-space:normal;min-height:42px}
  .view{overflow:visible;padding:16px 13px 30px}
  .wrap{width:100%;max-width:100%;min-width:0}
  .card{border-radius:16px}
  .card-pad{padding:16px}
  .sect-head{gap:9px;margin:22px 0 12px}
  .sect-head h2{font-size:.96rem}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:14px 13px;min-width:0}
  .kpi-v{font-size:1.5rem}
  .grid-2,.grid-3,.grid-4{grid-template-columns:minmax(0,1fr)!important}
  .acao-grid{grid-template-columns:minmax(0,1fr);gap:11px}
  .acao-card{padding:16px;gap:14px;min-height:92px;border-radius:16px}
  .acao-ic{width:48px;height:48px;min-width:48px;border-radius:14px}
  .acao-ic svg{width:24px;height:24px}
  .acao-t{font-size:.94rem}
  .subtabs{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:thin}
  .subtab{flex:0 0 auto;padding:11px 13px;min-height:44px}
  .tbl-scroll{overflow-x:auto;max-width:100%}
  table{min-width:640px}
  .occ-text{max-height:48vh;padding:12px;font-size:.82rem}
  .item-acts{display:flex;flex-wrap:wrap;gap:8px}
  .item-acts .btn{flex:1 1 auto;white-space:normal;min-height:42px}
  .occ-row{display:grid;grid-template-columns:auto auto 1fr;gap:8px;align-items:center}
  .occ-row .p{grid-column:1/-1;font-size:.8rem}
  .occ-row .h{font-size:.72rem}
  .occ-row .occ-copy{grid-column:1/-1;width:100%;min-height:42px}
  .modal{max-width:calc(100vw - 20px);border-radius:20px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

function esc(s) {
  return s == null ? '' : String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function norm(s) {
  return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function uid(p) { return (p || 'id') + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7); }
function todayKey(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function nowISO() { return new Date().toISOString(); }
function fmtDT(v) {
  if (!v) return '—';
  var d = new Date(v);
  if (isNaN(d)) return '—';
  return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
}
function ago(ts) {
  if (!ts) return '—';
  var s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'agora';
  var m = Math.floor(s / 60); if (m < 60) return 'há ' + m + ' min';
  var h = Math.floor(m / 60); if (h < 24) return 'há ' + h + 'h' + (m % 60 ? ' ' + (m % 60) + 'min' : '');
  var d = Math.floor(h / 24);
  if (d < 30) return 'há ' + d + 'd';
  return 'há ' + Math.floor(d / 30) + ' mes(es)';
}
function durH(ts) { return ts ? (Date.now() - ts) / 3600000 : 0; }
function isOn(s) { return String(s || '').toLowerCase() === 'ok'; }
function grp(arr, k) {
  return arr.reduce(function (a, x) { var v = x[k] || '—'; (a[v] = a[v] || []).push(x); return a; }, {});
}
function sortBy(arr, k, dir) {
  return arr.slice().sort(function (a, b) {
    var x = (a[k] || '').toString().toLowerCase(), y = (b[k] || '').toString().toLowerCase();
    var r = x.localeCompare(y, 'pt-BR');
    return dir === 'desc' ? -r : r;
  });
}

/* ---------- toast ---------- */
function toast(msg, kind) {
  var host = document.getElementById('toastHost');
  var icons = { ok: 'ok', err: 'alert', info: 'info', warn: 'warn' };
  var el = document.createElement('div');
  el.className = 'toast ' + (kind === 'err' ? 'err' : kind === 'info' ? 'info' : kind === 'warn' ? 'warn' : '');
  el.innerHTML = ic(icons[kind] || 'ok') + '<span>' + esc(msg) + '</span>';
  host.appendChild(el);
  setTimeout(function () {
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = '0'; el.style.transform = 'translateY(10px)';
    setTimeout(function () { el.remove(); }, 320);
  }, kind === 'err' ? 4200 : 2600);
}

/* ---------- modal ---------- */
function modal(opts) {
  var host = document.getElementById('modalHost');
  var fields = (opts.fields || []).map(function (f) {
    var v = f.value == null ? '' : f.value;
    var ctrl;
    if (f.type === 'select') {
      ctrl = '<select name="' + f.name + '">' + (f.options || []).map(function (o) {
        var val = o.value != null ? o.value : o;
        var lab = o.label != null ? o.label : o;
        return '<option value="' + esc(val) + '"' + (String(val) === String(v) ? ' selected' : '') + '>' + esc(lab) + '</option>';
      }).join('') + '</select>';
    } else if (f.type === 'textarea') {
      ctrl = '<textarea name="' + f.name + '" placeholder="' + esc(f.ph || '') + '">' + esc(v) + '</textarea>';
    } else {
      ctrl = '<input name="' + f.name + '" type="' + (f.type || 'text') + '" value="' + esc(v) + '" placeholder="' + esc(f.ph || '') + '">';
    }
    return '<div class="field ' + (f.full ? 'full' : '') + '"><label>' + esc(f.label) + (f.req ? ' *' : '') + '</label>' + ctrl + '</div>';
  }).join('');

  var bd = document.createElement('div');
  bd.className = 'backdrop';
  bd.innerHTML =
    '<div class="modal ' + (opts.wide ? 'wide' : '') + '" role="dialog" aria-modal="true">' +
      '<div class="modal-h"><h3>' + ic(opts.icon || 'edit') + esc(opts.title) + '</h3>' +
        '<button class="x" data-close aria-label="Fechar">&times;</button></div>' +
      '<div class="modal-b">' +
        (opts.intro ? '<div class="hintline" style="margin:0 0 16px">' + opts.intro + '</div>' : '') +
        '<form class="fgrid" id="mForm">' + fields + '</form>' +
        (opts.extra || '') +
      '</div>' +
      '<div class="modal-f">' +
        '<button class="btn" data-close>Cancelar</button>' +
        '<button class="btn primary" data-save>' + ic('check') + esc(opts.saveLabel || 'Salvar') + '</button>' +
      '</div>' +
    '</div>';
  host.appendChild(bd);

  var form = bd.querySelector('#mForm');
  function close() { bd.remove(); }
  bd.querySelectorAll('[data-close]').forEach(function (b) { b.onclick = close; });
  bd.onmousedown = function (e) { if (e.target === bd) close(); };
  document.addEventListener('keydown', function onKey(e) {
    if (!document.body.contains(bd)) { document.removeEventListener('keydown', onKey); return; }
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onKey); }
  });
  var first = form && form.querySelector('input,select,textarea');
  if (first) setTimeout(function () { first.focus(); }, 60);
  if (typeof opts.onReady === 'function') opts.onReady(bd, form);

  bd.querySelector('[data-save]').onclick = function () {
    var data = {};
    if (form) {
      Array.prototype.forEach.call(form.elements, function (el) { if (el.name) data[el.name] = el.value.trim(); });
    }
    var miss = (opts.fields || []).filter(function (f) { return f.req && !data[f.name]; });
    if (miss.length) { toast('Preencha: ' + miss.map(function (f) { return f.label; }).join(', '), 'err'); return; }
    if (opts.onSave && opts.onSave(data) === false) return;
    close();
  };
  return { close: close, el: bd };
}
function confirmar(msg, onYes, label) {
  modal({
    title: 'Confirmar', icon: 'warn', intro: esc(msg),
    fields: [], saveLabel: label || 'Confirmar',
    onSave: function () { onYes(); }
  });
}
function copyText(txt, msg) {
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(msg || 'Copiado!'); }
    catch (e) { toast('Não foi possível copiar.', 'err'); }
    ta.remove();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function () { toast(msg || 'Copiado!'); }, fallback);
  } else { fallback(); }
}
function download(name, text, mime) {
  var blob = new Blob(['\ufeff' + text], { type: (mime || 'text/plain') + ';charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
function csv(rows) {
  return rows.map(function (r) {
    return r.map(function (c) {
      var v = c == null ? '' : String(c);
      return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }).join(';');
  }).join('\r\n');
}

function viewOccList() {
  var lista = occurrencesSorted();
  var h = '<div class="sect-head mt"><h2>' + ic('list') + 'Resumos de plantão anteriores</h2>' +
          '<span class="hint">' + lista.length + ' registro(s) — clique para abrir</span>' +
          '<button class="btn sm" data-act="occ-toggle" style="margin-left:auto">' + ic('x') + 'Fechar</button></div>';
  h += '<div class="card card-pad"><div class="occ-list">';
  h += lista.map(function (o) {
    var prev = String(o.text || '').replace(/\s+/g, ' ').trim().slice(0, 130);
    var turnoCls = o.turno === 'Noturno' ? ' noturno' : (o.turno === 'Diurno' ? ' diurno' : '');
    return '<div class="occ-row" data-act="occ-open" data-id="' + esc(o.id) + '">' +
      '<span class="d">' + esc(o.date || '—') + '</span>' +
      (o.turno ? '<span class="t' + turnoCls + '">' + esc(o.turno) + '</span>' : '') +
      '<span class="h">' + esc(o.time || '') + '</span>' +
      '<span class="p">' + esc(prev) + '</span>' +
      '<button type="button" class="btn sm occ-copy" data-act="copy-occurrence" data-id="' + esc(o.id) + '">' + ic('copy') + 'Copiar</button>' +
      '</div>';
  }).join('');
  h += '</div></div>';
  return h;
}

function agoraHHMM() {
  var d = new Date();
  return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);

  for (var i = 0; i < ROTINA_ACOES.length; i++) if (ROTINA_ACOES[i].id === id) return ROTINA_ACOES[i];
  return null;
}
function normalizarHora(h) {
  var s = String(h || '').trim();
  if (!s) return '';
  var m = s.match(/^(\d{1,2})\s*[:hH]?\s*(\d{2})?/);
  if (!m) return s;
  return m[1] + 'h' + (m[2] || '00') + 'min';
}

/* ---------- FORMULÁRIO de ação rápida ---------- */
function acaoForm(id) {
  var ac = acharAcao(id);
  if (!ac) { toast('Ação não encontrada.', 'err'); return; }
  var defs = acaoCampos();
  var campos = ac.fields.map(function (n) { return defs[n]; }).filter(Boolean);
  campos = [{ name: 'data', label: 'Data da ocorrência', type: 'date', value: hojeISO(), req: true }].concat(campos);

  function gerar(d) {
    var a = { obs: '', hora: '', por: '', quem: '', solicitante: '', unidade: '', motivo: '',
              acompanhante: '', tipo: '', destino: '', horaDev: '', qual: '', autorizado: '',
              setor: '', conteudo: '', paciente: '', queixa: '', atendimento: '', desfecho: '',
              local: '', ocorrencia: '', acionado: '', elevador: '', situacao: '', piso: '',
              tecnico: '', horaRetorno: '', elevadores: '', acao: '', horaFim: '', monitores: '',
              qtd: '', retorno: '', causa: '', area: '', duracao: '', onde: '', achado: '',
              evento: '', responsavel: '', veiculo: '', placa: '', unidades: '', resultado: '',
              empresa: '', funcionarios: '', servico: '', entregues: '', retiradas: '',
              objeto: '', protocolo: '', devolvido: '', quemRetirou: '', origem: '', reclamacao: '' };
    Object.keys(d || {}).forEach(function (k) { a[k] = d[k]; });
    a.hora = normalizarHora(a.hora);
    if (a.horaDev) a.horaDev = normalizarHora(a.horaDev);
    if (a.horaFim) a.horaFim = normalizarHora(a.horaFim);
    if (a.horaRetorno) a.horaRetorno = normalizarHora(a.horaRetorno);
    if (a.retorno) a.retorno = normalizarHora(a.retorno);
    var txt = ac.tpl(a).replace(/\s+([.,;])/g, '$1').replace(/\s{2,}/g, ' ').trim();
    if (a.obs) txt += ' Obs.: ' + a.obs;
    return txt;
  }

  /* monta a lista de sugestões a partir do histórico, filtrando por palavras-chave da ação */
  function sugestoesPara() {
    var keywords = ac.sugKeys || [];
    if (!keywords.length) return [];
    var todas = occurrencesSorted();
    var out = [];
    for (var i = 0; i < todas.length && out.length < 8; i++) {
      var txt = norm(todas[i].text);
      for (var j = 0; j < keywords.length; j++) {
        if (txt.indexOf(norm(keywords[j])) >= 0) { out.push(todas[i]); break; }
      }
    }
    return out;
  }
  var sug = sugestoesPara();
  var extra = '<div class="previa-box">' +
               '<div class="previa-head">' + ic('file') + 'Texto pronto — padrão do resumo de plantão</div>' +
               '<div class="previa-txt" id="previaTxt"></div>' +
               '<div class="item-acts" style="margin-top:12px;gap:8px;flex-wrap:wrap">' +
                 '<button class="btn sm" type="button" data-copy-previa>' + ic('copy') + 'Copiar texto' +
                 '<span style="flex:1"></span>' +
               '</button>' +
               '<button class="btn sm" type="button" data-copy-whats>' + ic('chat') + 'Copiar com cabeçalho</button>' +
               '</div></div>';
  if (sug.length) {
    extra += '<div class="sug-wrap">' +
             '<div class="sug-head">' + ic('sparkle') + 'Sugestões do histórico — clique para reaproveitar como base</div>' +
             '<div class="sug-list">' + sug.map(function (s) {
      return '<button type="button" class="sug-item" data-sug-id="' + esc(s.id) + '">' +
        '<div class="sug-meta"><span>' + esc(s.date || '—') + '</span>' +
        (s.turno ? '<span>• ' + esc(s.turno) + '</span>' : '') +
        (s.autor ? '<span>• ' + esc(s.autor) + '</span>' : '') + '</div>' +
        '<div class="sug-txt">' + esc(String(s.text || '').replace(/\s+/g, ' ').trim().slice(0, 220)) + '</div>' +
        '</button>';
    }).join('') + '</div></div>';
  }

  modal({
    title: ac.label, icon: ac.icon, wide: true, saveLabel: 'Registrar ocorrência',
    intro: esc(ac.desc) + ' — os campos com * são obrigatórios.',
    fields: campos,
    extra: extra,
    onReady: function (bd, form) {
      function ler() {
        var d = {};
        if (form) Array.prototype.forEach.call(form.elements, function (el) { if (el.name) d[el.name] = el.value; });
        return d;
      }
      function atualizar() {
        var txt = gerar(ler());
        if (form) form.__textoGerado = txt;
        var out = bd.querySelector('#previaTxt');
        if (out) out.textContent = txt;
        return txt;
      }
      if (form) {
        form.addEventListener('input', atualizar);
        form.addEventListener('change', atualizar);
      }
      var cp = bd.querySelector('[data-copy-previa]');
      if (cp) cp.onclick = function () { copyText(form && form.__textoGerado || '', 'Texto copiado. Cole no WhatsApp.'); };
      var cw = bd.querySelector('[data-copy-whats]');
      if (cw) cw.onclick = function () {
        var d = ler();
        var cab = (d.data ? dataBR(d.data) : '') + (ac.label ? ' — ' + ac.label : '') + '\n\n';
        copyText(cab + (form && form.__textoGerado || ''), 'Texto com cabeçalho copiado.');
      };
      /* sugerir a partir do histórico: preenche o campo de observação com o trecho */
      bd.querySelectorAll('[data-sug-id]').forEach(function (b) {
        b.onclick = function () {
          var oc = occurrencesSorted().filter(function (x) { return x.id === b.getAttribute('data-sug-id'); })[0];
          if (!oc) return;
          var obs = form && form.elements && form.elements['obs'];
          if (obs) {
            obs.value = (obs.value ? obs.value + '\n' : '') +
              '[Base — ' + (oc.date || '') + '] ' + String(oc.text || '').slice(0, 500);
            atualizar();
            obs.focus();
            toast('Trecho do histórico colado em Observações. Ajuste conforme necessário.');
          }
        };
      });
      atualizar();
    },
    onSave: function (d) {
      var txt = gerar(d);
      var iso = d.data || hojeISO();
      (S.occurrences = S.occurrences || []).push({
        id: uid('oc'), iso: iso, date: dataBR(iso), time: d.hora || agoraHHMM(),
        turno: '', autor: d.por || '', source: 'Rotina — ' + ac.label,
        text: txt, createdAt: nowISO()
      });
      save(); render();
      toast('Ocorrência registrada. O texto já está disponível no Painel.');
    }
  });
}

function viewRotina() {

  var freqList = ['Diária', 'Semanal', 'Mensal'];

  var h = '';

    kpi('Tarefas hoje', doneToday + '/' + today.length, today.length ? Math.round(doneToday / today.length * 100) + '% concluído' : 'sem tarefas diárias',

       '<span class="hint">' + S.routines.length + ' cadastradas</span></div>';

  h += '<div class="tools">' +

    }).join('') + '</div>' +
    '<select class="sel" data-rf="area"><option value="Todas">Todas as áreas</option>' +
      areaList.map(function (a) { return '<option value="' + esc(a) + '"' + (UI.routineFilter === a ? ' selected' : '') + '>' + esc(a) + '</option>'; }).join('') +
    '</select>' +

  if (!list.length) {
    h += '<div class="card">' + emptyBox('Nenhuma tarefa encontrada', 'Ajuste os filtros ou cadastre uma nova tarefa.', 'check') + '</div>';

  var byShift = grp(list, 'shift');

function auditar() {
  var ipMap = {}, nameMap = {}, noIP = [], noPiso = [], noLocal = [], badIP = [];
  S.cameras.forEach(function (c) {
    var ip = (c.ip || '').trim();
    if (ip) {
      (ipMap[ip] = ipMap[ip] || []).push(c);
      if (!/^192\.168\.\d{1,3}\.\d{1,3}$/.test(ip)) badIP.push(esc(c.name) + ' — <span class="mono">' + esc(ip) + '</span>');
    } else noIP.push(esc(c.name) + ' <span class="muted">(' + esc(c.piso || '—') + ' • ' + esc(c.local || '—') + ')</span>');
    var nm = norm(c.name).replace(/\s+/g, '');
    (nameMap[nm] = nameMap[nm] || []).push(c);
    if (!c.piso) noPiso.push(esc(c.name) + ' <span class="muted">(' + esc(c.local || '—') + ')</span>');
    if (!c.local) noLocal.push(esc(c.name) + ' <span class="muted">(' + esc(c.piso || '—') + ')</span>');
  });
  var dupIP = Object.keys(ipMap).filter(function (k) { return ipMap[k].length > 1; })
    .map(function (k) { return '<b class="mono">' + esc(k) + '</b> — ' + ipMap[k].map(function (c) { return esc(c.name); }).join(', '); });
  var dupName = Object.keys(nameMap).filter(function (k) { return nameMap[k].length > 1; })
    .map(function (k) { return nameMap[k].map(function (c) { return esc(c.name); }).join(' <span class="muted">/</span> '); });
  return { dupIP: dupIP, badIP: badIP, dupName: dupName, noIP: noIP, noPiso: noPiso, noLocal: noLocal,
    total: dupIP.length + badIP.length + dupName.length + noIP.length + noPiso.length + noLocal.length };
}

var PROC_CHK = {};
function restoreChecklists() {
  Object.keys(PROC_CHK).forEach(function (pid) {
    var set = PROC_CHK[pid] || {};
    var box = document.querySelector('[data-checklist="' + pid + '"]');
    if (!box) return;
    var steps = box.querySelectorAll('.step');
    var done = 0;
    steps.forEach(function (el, i) { if (set[i]) { el.classList.add('done'); done++; } });
    var card = box.closest('[data-proc]');
    if (card) {
      var bar = card.querySelector('.bar i'), lab = card.querySelector('.bar small');
      var pct = steps.length ? Math.round(done / steps.length * 100) : 0;
      if (bar) { bar.style.width = pct + '%'; if (pct === 100) bar.classList.add('done'); }
      if (lab) lab.textContent = pct + '%';
    }
  });
}
function syncChecklist(pid) {
  var box = document.querySelector('[data-checklist="' + pid + '"]');
  if (!box) return { done: 0, total: 0 };
  var steps = box.querySelectorAll('.step');
  var set = PROC_CHK[pid] || {};
  var done = 0;
  steps.forEach(function (el, i) { if (set[i]) done++; });
  var card = box.closest('[data-proc]');
  if (card) {
    var bar = card.querySelector('.bar i'), lab = card.querySelector('.bar small');
    var pct = steps.length ? Math.round(done / steps.length * 100) : 0;
    if (bar) { bar.style.width = pct + '%'; bar.classList.toggle('done', pct === 100); }
    if (lab) lab.textContent = pct + '%';
  }

function softRender(pageId, input) {
  var val = input.value, sel = input.selectionStart;
  var host = document.getElementById('view');
  var active = document.activeElement;
  var wasSearch = active && (active.hasAttribute('data-cq') || active.hasAttribute('data-cm'));
  host.innerHTML = RENDER[pageId]();
  if (wasSearch) {
    var again = host.querySelector(active.hasAttribute('data-cq') ? '[data-cq]' : '[data-cm]');
    if (again) { again.value = val; again.focus(); try { again.setSelectionRange(sel, sel); } catch (err) {} }
  }
  if (pageId === 'procedimentos') restoreChecklists();
  setSaved();
}

function dataBR(iso) {
  if (!iso) return '';
  var p = String(iso).split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso;
}
function hojeISO() {
  var d = new Date();
  var m = String(d.getMonth() + 1), dia = String(d.getDate());
  return d.getFullYear() + '-' + (m.length < 2 ? '0' + m : m) + '-' + (dia.length < 2 ? '0' + dia : dia);
}
function ontemISO() {
  var d = new Date(); d.setDate(d.getDate() - 1);
  var m = String(d.getMonth() + 1), dia = String(d.getDate());
  return d.getFullYear() + '-' + (m.length < 2 ? '0' + m : m) + '-' + (dia.length < 2 ? '0' + dia : dia);
}

function importOccurrenceForm() {
  modal({
    title: 'Colar resumo do WhatsApp', icon: 'backup', saveLabel: 'Registrar',
    intro: 'Copie a mensagem no WhatsApp (toque e segure → Copiar) e cole abaixo. A data e a hora são reconhecidas automaticamente quando aparecem no texto.',
    fields: [{ name: 'text', label: 'Mensagem colada', type: 'textarea', req: true, full: true,
      ph: '07:00 - Natanael: Bom dia. Segue resumo do Plantão Noturno...' }],
    onSave: function (d) {
      var txt = d.text || '';
      var iso = ontemISO(), hora = '';
      var md = txt.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
      if (md) {
        var ano = md[3].length === 2 ? '20' + md[3] : md[3];
        iso = ano + '-' + ('0' + md[2]).slice(-2) + '-' + ('0' + md[1]).slice(-2);
      }
      var mh = txt.match(/^\s*(\d{1,2}):(\d{2})/) || txt.match(/\b(\d{1,2})h(\d{2})\b/);
      if (mh) hora = ('0' + mh[1]).slice(-2) + ':' + mh[2];
      var autor = '';
      var ma = txt.match(/^\s*\d{1,2}:\d{2}\s*-\s*([^:\n]{2,40}):/);
      if (ma) autor = ma[1].trim();
      var turno = /noturno/i.test(txt) ? 'Noturno' : (/diurno/i.test(txt) ? 'Diurno' : '');
      (S.occurrences = S.occurrences || []).push({
        id: uid('oc'), iso: iso, date: dataBR(iso), time: hora, turno: turno, autor: autor,
        source: 'WhatsApp — colado manualmente', text: txt.trim(), createdAt: nowISO()
      });
      save(); render();
      toast('Ocorrência registrada' + (dataBR(iso) ? ' para ' + dataBR(iso) : '') + '.');
    }
  });

      d.topics = (d.topics || '').split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
      if (e.id) { Object.assign(e, d); toast('Documento atualizado.'); }
      else { d.id = uid('mn'); d.createdAt = nowISO(); S.manuals.push(d); toast('Documento criado.'); }
      save(); render();
    }
  });
}

/* ============================================================
   EXPORTAÇÕES / BACKUP
   ============================================================ */
function exportCamCSV() {
  var rows = [['Nome', 'Tipo', 'Piso', 'Local', 'IP', 'Modelo', 'Situação', 'Parada desde']];
  S.cameras.forEach(function (c) {
    rows.push([c.name, c.type, c.piso, c.local, c.ip, c.model, isOn(c.status) ? 'Online' : 'Off-line', isOn(c.status) ? '' : fmtDT(c.since)]);
  });
  download('cftv_cameras_' + todayKey() + '.csv', csv(rows), 'text/csv');
  toast('CSV das câmeras exportado.');
}
function exportRoutineCSV() {
  var rows = [['Tarefa', 'Área', 'Frequência', 'Turno', 'Horário', 'Concluída hoje', 'Como executar']];
  S.routines.forEach(function (r) { rows.push([r.title, r.area, r.freq, r.shift, r.time, isDone(r) ? 'Sim' : 'Não', r.how]); });
  download('rotina_' + todayKey() + '.csv', csv(rows), 'text/csv');
  toast('CSV da rotina exportado.');
}
function exportContactCSV() {
  var rows = [['Nome', 'Área', 'Função', 'Telefone', 'Ramal', 'E-mail', 'Cartão', 'Validade', 'Situação']];
  S.contacts.forEach(function (c) { rows.push([c.name, c.area, c.role, c.phone, c.ext, c.email, c.card, c.valid, c.status]); });
  download('contatos_' + todayKey() + '.csv', csv(rows), 'text/csv');
  toast('CSV dos contatos exportado.');
}
function exportEqCSV() {
  var rows = [['Nome', 'Tipo', 'Modelo', 'Local', 'Qtd', 'Estado', 'Patrimônio', 'Série', 'Observações']];
  S.equipments.forEach(function (e) {
    rows.push([e.name, e.type, e.model, e.local, e.qty, e.status === 'critico' ? 'Crítico' : 'Operacional', e.tag, e.serial, e.obs]);
  });
  download('equipamentos_' + todayKey() + '.csv', csv(rows), 'text/csv');
  toast('CSV dos equipamentos exportado.');
}
function doBackup() {
  var payload = JSON.stringify(S, null, 1);
  download('backup_central_operacoes_' + todayKey() + '.json', payload, 'application/json');
  toast('Backup gerado. Guarde o arquivo em local seguro.');
}
document.getElementById('fileIn').addEventListener('change', function (ev) {
  var f = ev.target.files && ev.target.files[0];
  if (!f) return;
  var fr = new FileReader();
  fr.onload = function () {
    try {
      var p = JSON.parse(fr.result);
      if (!p || typeof p !== 'object') throw new Error('formato');
      confirmar('Restaurar o backup "' + f.name + '"? Os dados atuais serão substituídos.', function () {
        var d = defaultState();
        S = {
          version: 2, created: p.created || d.created, updated: nowISO(),
          routines: p.routines || d.routines, checks: p.checks || {},
          contacts: p.contacts || d.contacts, procedures: p.procedures || d.procedures,
          equipments: p.equipments || d.equipments, cameras: p.cameras || d.cameras,
          manuals: p.manuals || d.manuals, occurrences: p.occurrences || d.occurrences,
          otis: p.otis || d.otis
        };
        save(); render(); toast('Backup restaurado com sucesso.');
      }, 'Restaurar');
    } catch (err) { toast('Arquivo inválido: não é um backup deste sistema.', 'err'); }
    ev.target.value = '';
  };
  fr.readAsText(f);
});

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
function clock() {
  var el = document.getElementById('clock');
  if (el) el.textContent = new Date().toLocaleTimeString('pt-BR');
}
document.addEventListener('keydown', function (e) {
  if (e.target.matches('input,textarea,select')) return;
  var i = parseInt(e.key, 10);
  if (i >= 1 && i <= PAGES.length) setPage(PAGES[i - 1].id);
});
load();
renderNav();
render();
clock();
setInterval(clock, 1000);
setInterval(function () { if (UI.page === 'painel' || UI.page === 'cftv') render(); }, 60000);

})();
</script>
