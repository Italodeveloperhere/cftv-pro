<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="CFTV — Monitoramento operacional, gravadores e manuais.">
<title>CFTV • Monitoramento Operacional</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">

  <div class="top-block">
    <div class="header">
      <h1 class="title"><span class="badge">🎥</span> CFTV • Monitoramento Operacional</h1>
      <div class="actions">
        <div class="clock" id="syncStatus"><span class="pulse-dot"></span><span id="clock">--:--:--</span></div>
        <button class="btn green" onclick="exportarCSV()">⬇ CSV</button>
        <button class="btn" onclick="sincronizarManual()">🔄 Recarregar</button>
        <button class="btn red" onclick="resetar()">↺ Restaurar</button>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="cameras" onclick="setTab('cameras')">📋 Câmeras <span class="cnt" id="tab-cam-count">0</span></button>
    <button class="tab" data-tab="gravadores" onclick="setTab('gravadores')">📼 Gravadores <span class="cnt" id="tab-grav-count">0</span></button>
    <button class="tab" data-tab="equipamentos" onclick="setTab('equipamentos')">🖥️ Equipamentos <span class="cnt" id="tab-equip-count">0</span></button>
    <button class="tab" data-tab="auditoria" onclick="setTab('auditoria')">🔍 Auditoria <span class="cnt" id="tab-audit-count">0</span></button>
    <button class="tab" data-tab="topologia" onclick="setTab('topologia')">🌐 Topologia</button>
    <button class="tab" data-tab="manual" onclick="setTab('manual')">📖 Manual</button>
    <button class="tab" data-tab="rede" onclick="setTab('rede')">🔌 Rede</button>
  </div>

  <div id="tab-cameras-content">
    <div class="legend-box">
      <span class="legend-title">Legenda:</span>
      <button class="legend-item" data-legend="ip" onclick="toggleLegend('ip')"><span class="dot ip"></span> IP <span class="count" id="count-ip">0</span></button>
      <button class="legend-item" data-legend="analog" onclick="toggleLegend('analog')"><span class="dot analog"></span> Analógica <span class="count" id="count-analog">0</span></button>
      <button class="legend-item" data-legend="online" onclick="toggleLegend('online')"><span class="dot online"></span> Online <span class="count" id="count-online">0</span></button>
      <button class="legend-item" data-legend="offline" onclick="toggleLegend('offline')"><span class="dot offline"></span> Off-line <span class="count" id="count-offline">0</span></button>
    </div>
    <div class="toolbar-box">
      <div class="toolbar">
        <input class="search" id="search" placeholder="🔍 Buscar por nome, IP, MAC, modelo ou local...">
        <button class="btn small active" data-filter="all" onclick="setFilter('all')">Todas</button>
        <button class="btn small" data-filter="online" onclick="setFilter('online')">🟢 Online</button>
        <button class="btn small" data-filter="offline" onclick="setFilter('offline')">🔴 Off-line</button>
        <select class="search" id="floorFilter" style="max-width:170px"><option value="all">Todos os pisos</option></select>
      </div>
    </div>
    <div class="table-box">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th style="width:60px">Ligar</th>
              <th>Nome da Câmera</th>
              <th>Tipo</th>
              <th>Piso</th>
              <th>Local</th>
              <th>IP</th>
              <th>MAC</th>
              <th>Status</th>
              <th>Desde</th>
              <th>Tempo</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="tab-gravadores-content" style="display:none">
    <div class="toolbar-box">
      <div class="toolbar">
        <input class="search" id="gravSearch" placeholder="🔍 Buscar gravador ou câmera...">
        <button class="btn small active" data-grav-filter="all" onclick="setGravFilter('all')">Todos</button>
        <button class="btn small" data-grav-filter="nvr" onclick="setGravFilter('nvr')">📼 NVRs</button>
        <button class="btn small" data-grav-filter="dvr" onclick="setGravFilter('dvr')">📼 DVRs</button>
        <button class="btn small" data-grav-filter="srv" onclick="setGravFilter('srv')">🖥️ Servidores</button>
      </div>
    </div>
    <div class="grav-grid" id="gravGrid"></div>
  </div>

  <div id="tab-equipamentos-content" style="display:none">
    <div class="locais-grid" id="equipGrid"></div>
  </div>

  <div id="tab-auditoria-content" style="display:none">
    <div class="audit-grid" id="auditGrid"></div>
  </div>

  <div id="tab-topologia-content" style="display:none">
    <div id="topoHost"></div>
  </div>

  <div id="tab-manual-content" style="display:none">
    <div id="manualHost"></div>
  </div>

  <div id="tab-rede-content" style="display:none">
    <div id="redeHost"></div>
  </div>

  <div class="footer">
    💾 <span id="syncInfo">Carregando cameras.json...</span> • <span id="totalCount">0</span> câmeras • <span id="offCount">0</span> off-line • <span id="equipCount">0</span> equipamentos
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
